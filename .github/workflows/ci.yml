name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job can write (to publish the release).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the trawl serve image
        run: docker build -t trawl:ci .
      - name: Refuses to start without configuration
        run: |
          if docker run --rm trawl:ci 2>err.txt; then echo "started without config"; exit 1; fi
          grep -q "configuration problems" err.txt
      - name: Serves a site read-only, as non-root, behind sign-in
        run: |
          set -euo pipefail
          mkdir -m 777 ci-site
          docker run --rm -v "$PWD/examples:/docs:ro" -v "$PWD/ci-site:/out" --entrypoint /usr/local/bin/trawl trawl:ci site /docs -o /out
          docker run -d --name trawl-ci --read-only --tmpfs /tmp:uid=65532 --cap-drop ALL -p 8080:8080 \
            -e TRAWL_PUBLIC_URL=http://localhost:8080 -e TRAWL_INSECURE_DEV=1 -e TRAWL_ALLOWED_DOMAINS=example.com \
            -e TRAWL_SECRET="$(openssl rand -hex 32)" -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=y \
            -e TRAWL_SITE_DIR=/srv/site -v "$PWD/ci-site:/srv/site:ro" trawl:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          test "$(docker inspect -f '{{.Config.User}}' trawl-ci)" = "nonroot:nonroot"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'accept: text/html' localhost:8080/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp -d '{}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/trawl.json)" = 401
      - name: Container logs
        if: always()
        run: docker logs trawl-ci 2>&1 | tail -50 || true

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Build binaries
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bun build --compile --minify --target=bun-$target src/cli.ts --outfile dist/trawl-$target
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
